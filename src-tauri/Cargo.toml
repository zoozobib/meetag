[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = [ "you",]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "app_lib"
crate-type = [ "staticlib", "cdylib", "rlib",]

[dependencies]
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
anyhow = "1.0"
cpal = "0.15.3"
futures-util = "0.3"
futures-channel = "0.3.31"
ringbuf = "0.4.8"
once_cell = "1.17.1"
tempfile = "3.10"
webrtc-vad = "0.4.0"
chrono = "0.4"
lazy_static = "1.4"

# Audio Processing: Professional quality enhancement
ebur128 = "0.1"           # EBU R128 loudness normalization (broadcast standard)
nnnoiseless = "0.5"       # RNNoise-based neural network noise reduction

# PERFORMANCE: Enable Metal GPU + CoreML acceleration automatically on macOS
# CoreML provides additional acceleration for Apple Silicon chips
whisper-rs = { version = "0.13.2", features = ["raw-api", "metal", "coreml"] }
dirs = "6.0.0"
sherpa-rs = "0.6.8"
regex = "1.12.2"

[dependencies.serde]
version = "1.0"
features = [ "derive",]

[dependencies.tauri]
version = "2.6.2"
features = ["tray-icon"]

[dependencies.tokio]
version = "1.32.0"
features = [ "full",]

[dependencies.reqwest]
version = "0.11"
features = ["blocking", "json", "multipart", "rustls-tls", "stream"]

[build-dependencies.tauri-build]
version = "2.3.0"
features = []

[target."cfg(target_os = \"macos\")".dependencies.cidre]
git = "https://github.com/yury/cidre"
rev = "a9587fa"
features = ["av", "sc"]

[dev-dependencies]
hound = "3.5.1"
sherpa-rs = "0.6.8"
