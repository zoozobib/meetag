[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = [ "you",]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "app_lib"
crate-type = [ "staticlib", "cdylib", "rlib",]

[dependencies]
serde_json = "1.0"
log = "0.4"
tauri-plugin-log = "2"
anyhow = "1.0"
cpal = "0.15.3"
futures-util = "0.3"
futures-channel = "0.3.31"
ringbuf = "0.4.8"
once_cell = "1.17.1"
tempfile = "3.10"
webrtc-vad = "0.4.0"

[dependencies.serde]
version = "1.0"
features = [ "derive",]

[dependencies.tauri]
version = "2.6.2"
features = []

[dependencies.tokio]
version = "1.32.0"
features = [ "full",]

[dependencies.reqwest]
version = "0.11"
features = [ "blocking", "json", "multipart", "rustls-tls", "stream",]

[build-dependencies.tauri-build]
version = "2.3.0"
features = []

[target."cfg(target_os = \"macos\")".dependencies.cidre]
git = "https://github.com/yury/cidre"
rev = "a9587fa"
features = [ "av",]
