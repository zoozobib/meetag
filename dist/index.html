<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Realtime ASR Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system;
            padding: 16px;
        }

        button {
            padding: 10px 14px;
            margin-right: 8px;
        }

        #log {
            white-space: pre-wrap;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            height: 320px;
            overflow: auto;
        }
    </style>
</head>

<body>
    <h2>Realtime ASR Test</h2>
    <button id="btnStart">Start</button>
    <button id="btnStop">Stop</button>
    <div id="status"></div>
    <h3>Transcript</h3>
    <div id="log"></div>

    <script>
        const { invoke } = window.__TAURI__.core;
        const { listen } = window.__TAURI__.event;

        const logEl = document.getElementById("log");
        const statusEl = document.getElementById("status");

        function appendLine(s) {
            logEl.textContent += s + "\n";
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function setupListeners() {
            await listen("asr_partial", (e) => { statusEl.textContent = e.payload; });
            await listen("asr_final", (e) => {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false });
                appendLine(`[${timeStr}] ${e.payload}`);
            });
            appendLine("✅ ASR listeners ready");
        }

        document.getElementById("btnStart").addEventListener("click", async () => {
            appendLine("▶ start_recording...");
            try {
                const out = await invoke("start_recording");
                appendLine("✅ started: " + JSON.stringify(out));
            } catch (err) {
                appendLine("❌ start_recording failed: " + err);
            }
        });

        document.getElementById("btnStop").addEventListener("click", async () => {
            appendLine("■ stop_recording...");
            try {
                const out = await invoke("stop_recording");
                appendLine("✅ stopped: " + JSON.stringify(out));
            } catch (err) {
                appendLine("❌ stop_recording failed: " + err);
            }
        });

        setupListeners();
    </script>
</body>

</html>
