<!doctype html>
<html>

<body>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
    <pre id="log"></pre>
    <h3>Transcript</h3>
    <pre id="tx"></pre>

    <script>
        const log = (s) => {
            document.getElementById("log").textContent += s + "\n";
            console.log(s);
        };

        async function invoke(cmd, args) {
            // ✅ 纯静态页面必须用 window.__TAURI__
            if (!window.__TAURI__ || !window.__TAURI__.core || !window.__TAURI__.core.invoke) {
                log("❌ Tauri API not found. window.__TAURI__ is undefined");
                return null;
            }
            return await window.__TAURI__.core.invoke(cmd, args);
        }

        // Listen to realtime ASR events
        const listen = window.__TAURI__?.event?.listen;
        async function setupListeners() {
            if (!listen) { log("⚠️ tauri event.listen not available"); return; }
            await listen('asr_final', (event) => {
                const tx = document.getElementById('tx');
                tx.textContent += event.payload + "\n";
            });
            await listen('asr_partial', (event) => {
                // optional: show partial in last line
            });
            log('✅ ASR listeners ready');
        }
        setupListeners();

        document.getElementById("start").onclick = async () => {
            log("▶ start_recording...");
            try {
                const res = await invoke("start_recording", {});
                log("✅ started: " + JSON.stringify(res));
            } catch (e) {
                log("❌ start err: " + e);
            }
        };

        document.getElementById("stop").onclick = async () => {
            log("■ stop_recording...");
            try {
                const res = await invoke("stop_recording", {});
                log("✅ stopped: " + JSON.stringify(res));
            } catch (e) {
                log("❌ stop err: " + e);
            }
        };

        // Auto-start realtime ASR on page load
        window.addEventListener("DOMContentLoaded", async () => {
            try {
                log("🚀 auto start realtime ASR...");
                await invoke("start_realtime_asr", { serverUrl: "http://127.0.0.1:8178/transcribe" });
                log("✅ realtime ASR started");
            } catch (e) {
                log("❌ start_realtime_asr failed: " + e);
            }
        });

    </script>
</body>

</html>
